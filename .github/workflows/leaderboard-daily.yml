name: Daily leaderboard

# Daily summary fires at 03:30 UTC = 09:00 IST (start of working day).
# Manual trigger via "Run workflow" button is also enabled for ad-hoc posts.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Post daily leaderboard
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT=$(bun scripts/leaderboard.ts "24 hours ago" "Daily leaderboard")
          curl -sS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TEXT}"
